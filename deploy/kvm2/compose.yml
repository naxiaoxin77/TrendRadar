name: trendradar

services:
  trendradar:
    build:
      context: ../..
      dockerfile: deploy/kvm2/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    image: trendradar-kvm2:6.11.0
    container_name: trendradar
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    env_file:
      - /etc/trendradar/runtime.env
    environment:
      TZ: Asia/Singapore
      STORAGE_BACKEND: remote
      RUN_MODE: cron
      CRON_SCHEDULE: "0 */8 * * *"
      IMMEDIATE_RUN: "false"
      WEBSERVER_PORT: "8080"
    volumes:
      - ../../config:/app/config:ro
      - /opt/trendradar/output:/app/output
    # Reports are delivered to Feishu; no public port is required.
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/crontab && test \"$$(cat /proc/1/comm)\" = supercronic"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
