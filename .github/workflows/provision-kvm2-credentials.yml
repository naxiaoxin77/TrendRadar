name: Provision TrendRadar KVM 2 credentials
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trendradar-kvm2-credential-provisioning
  cancel-in-progress: false
jobs:
  seal:
    if: github.repository == 'naxiaoxin77/TrendRadar' && github.actor == 'naxiaoxin77'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt existing credentials for the selected VPS
        shell: bash
        env:
          RECIPIENT_PUBLIC_KEY: ''
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const publicDer = Buffer.from(process.env.RECIPIENT_PUBLIC_KEY, 'base64');
          const fingerprint = crypto.createHash('sha256').update(publicDer).digest('hex');
          if (fingerprint !== 'b35726be3d4daa2838cca913937b3e2703fe57c970db4f49795cfef49c60424f') throw new Error('Unexpected recipient');
          const names = ['S3_ENDPOINT_URL','S3_BUCKET_NAME','S3_ACCESS_KEY_ID','S3_SECRET_ACCESS_KEY','FEISHU_WEBHOOK_URL'];
          const credentials = Object.fromEntries(names.map(name => {
            const value = process.env[name];
            if (!value || /[\r\n\0]/.test(value)) throw new Error('Missing or invalid credential: '+name);
            return [name, value];
          }));
          if (credentials.S3_BUCKET_NAME !== 'trendradar-data') throw new Error('Unexpected R2 bucket');
          if (new URL(credentials.S3_ENDPOINT_URL).hostname !== '7b368d6a8c5f597690a076f63ac21ec3.r2.cloudflarestorage.com') throw new Error('Unexpected R2 account');
          for (const url of credentials.FEISHU_WEBHOOK_URL.split(';')) {
            const parsed = new URL(url);
            if (parsed.protocol !== 'https:' || !['open.feishu.cn','open.larksuite.com'].includes(parsed.hostname)) throw new Error('Unexpected notification endpoint');
          }
          credentials.S3_REGION = process.env.S3_REGION || 'auto';
          const key = crypto.randomBytes(32);
          const nonce = crypto.randomBytes(12);
          const aad = 'TrendRadar|KVM2|31.97.51.69|trendradar-data|2026-11-17';
          const cipher = crypto.createCipheriv('aes-256-gcm', key, nonce);
          cipher.setAAD(Buffer.from(aad));
          const ciphertext = Buffer.concat([cipher.update(JSON.stringify(credentials), 'utf8'), cipher.final()]);
          const wrappedKey = crypto.publicEncrypt({
           key: crypto.createPublicKey({key:publicDer,format:'der',type:'spki'}),
           padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'
          }, key);
          fs.writeFileSync('trendradar-kvm2.sealed.json', JSON.stringify({
           format:'rsa-oaep-sha256+aes-256-gcm',recipient_sha256:fingerprint,aad,
           wrapped_key:wrappedKey.toString('base64'),nonce:nonce.toString('base64'),
           tag:cipher.getAuthTag().toString('base64'),ciphertext:ciphertext.toString('base64')
          }), {mode:0o600});
          key.fill(0);
          console.log('Encrypted credentials for KVM 2; plaintext was not written to disk.');
          
          NODE
      - name: Upload only the encrypted payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trendradar-kvm2-sealed-credentials
          path: trendradar-kvm2.sealed.json
          retention-days: 1
          if-no-files-found: error
